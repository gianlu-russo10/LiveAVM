<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>AVM Live Tracker - Gianluca Russo</title>

    <style>
        body {
            background-color: #040430;
            color: white;
            font-weight: bold;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .turno {
            font-size: 22px;
            padding: 15px 0;
            cursor: pointer;
        }

        hr {
            border: 1px solid white;
            opacity: 1;
        }

        .turno:hover {
            color: #a8c8ff;
        }
    </style>
</head>

<body>

    <h1>Selezionare Turno Macchina</h1>

    <div class="turno" onclick="selezionaTurno('CB101')">
        Turno CB101
    </div>
    <hr>

    <div class="turno" onclick="selezionaTurno('CB201')">
        Turno CB201
    </div>
    <hr>

    <!-- altri turni in futuro -->
    
    <script>
        
        function selezionaTurno(turno) {
           // apre direttamente il file HTML con lo stesso nome del turno
           window.location.href = turno + ".html";
        }
        
    </script>

</body>
</html>
